<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block;
                      background: #000; touch-action: none; outline: none; }
      #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 60%; max-width: 420px;
                 font: 600 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; text-align: center; }
      #loading .bar { margin-top: 12px; height: 10px; border: 2px solid #fff; border-radius: 7px; overflow: hidden; }
      #loading .fill { height: 100%; width: 0%; background: #ffd23f; }
      #rotate { display: none; position: fixed; inset: 0; background: #000; color: #fff; z-index: 10;
                font: 600 20px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
                align-items: center; justify-content: center; text-align: center; padding: 24px; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
      #message { display: none; position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 11;
                 max-width: 90%; padding: 8px 12px; border-radius: 6px; background: #ffd23f; color: #000;
                 font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
    <div id="loading">{{{ PRODUCT_NAME }}}<div class="bar"><div class="fill"></div></div></div>
    <div id="rotate">Turn your phone sideways to play</div>
    <div id="message"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#loading .fill");
      var message = document.querySelector("#message");
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                   (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));

      // Unity's messages: errors stay, warnings go after a few seconds
      function unityShowBanner(msg, type) {
        message.textContent = msg;
        message.style.display = "block";
        message.style.background = type == "error" ? "#ff6b6b" : "#ffd23f";
        if (type != "error")
          setTimeout(function () { message.style.display = "none"; }, 5000);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };
      // a phone's screen at its full pixel density costs the GPU a lot for
      // pixel art: at most twice the CSS size
      if (mobile)
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      // a phone: the first touch goes full screen, sideways where the
      // browser allows it (Android; iOS Safari has no full screen API)
      if (mobile) {
        var goFull = function () {
          var el = document.documentElement;
          var req = el.requestFullscreen || el.webkitRequestFullscreen;
          if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
            try {
              var p = req.call(el);
              if (p && p.then)
                p.then(function () {
                  if (screen.orientation && screen.orientation.lock)
                    screen.orientation.lock("landscape").catch(function () {});
                }).catch(function () {});
            } catch (e) {}
          }
        };
        document.addEventListener("touchend", goFull, { passive: true });
      }
      // no page scrolling, zooming or long-press menu on the game
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          loading.style.display = "none";
          canvas.focus();
        }).catch(function (msg) {
          unityShowBanner(msg, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
